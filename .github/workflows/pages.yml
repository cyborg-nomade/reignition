name: Deploy Reignition to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "pdf-epub/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: site/uv.lock

      - name: Install the site dependencies
        working-directory: site
        run: uv sync --locked

      - name: Build the static site
        working-directory: site
        run: uv run mkdocs build --strict

      - name: Add the downloadable editions
        run: |
          mkdir -p site/build/downloads
          cp pdf-epub/*.pdf pdf-epub/*.epub site/build/downloads/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
